
name: Publicar BRIK Intelligence Hub

on:
  push:
    branches:
      - desarrollo-app
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar prototipo original
        uses: actions/checkout@v4
        with:
          ref: main
          path: original

      - name: Descargar aplicacion en desarrollo
        uses: actions/checkout@v4
        with:
          ref: desarrollo-app
          path: desarrollo

      - name: Preparar sitio
        run: |
          mkdir -p public/clientes/dl-expeditions
          cp original/index.html public/index.html
          cp desarrollo/clientes/dl-expeditions/index.html public/clientes/dl-expeditions/index.html
          touch public/.nojekyll

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Subir archivos
        uses: actions/upload-pages-artifact@v3
        with:
          path: public

      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
