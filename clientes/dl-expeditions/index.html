
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1">
  <title>BRIK | DL Expeditions</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: #10191b;
      color: #fff;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    .card {
      width: 100%;
      max-width: 420px;
      padding: 36px;
      background: #1d292c;
      border: 1px solid #405052;
      border-radius: 18px;
    }
    .logo {
      font-size: 38px;
      font-weight: 900;
      letter-spacing: -2px;
    }
    .logo span { color: #ff9654; }
    .subtitle {
      color: #b9c5c6;
      line-height: 1.6;
    }
    label {
      display: block;
      margin: 20px 0 8px;
      font-size: 13px;
    }
    input, button {
      width: 100%;
      padding: 14px;
      border-radius: 9px;
      font-size: 15px;
    }
    input {
      background: #fff;
      color: #172123;
      border: 0;
    }
    button {
      margin-top: 24px;
      background: #ff9654;
      border: 0;
      color: #111;
      font-weight: bold;
      cursor: pointer;
    }
    button:disabled { opacity: .6; }
    #message {
      margin-top: 16px;
      font-size: 13px;
      line-height: 1.5;
    }
    #app { display: none; }
  </style>
</head>
<body>
  <main class="card">
    <div class="logo">BRI<span>K.</span></div>
    <p class="subtitle">
      INTELLIGENCE HUB<br>
      DL Expeditions · Acceso privado
    </p>

    <form id="login">
      <label for="email">Correo electrónico</label>
      <input id="email" type="email" required
             autocomplete="username">

      <label for="password">Contraseña</label>
      <input id="password" type="password" required
             autocomplete="current-password">

      <button id="loginButton" type="submit">
        Iniciar sesión
      </button>
    </form>

    <section id="app">
      <h2>Bienvenida a BRIK</h2>
      <p class="subtitle">
        Sesión de administración activa.
      </p>
      <button id="logoutButton">Cerrar sesión</button>
    </section>

    <p id="message" role="status"></p>
  </main>

  <script type="module">
    import { createClient } from
      'https://esm.sh/@supabase/supabase-js@2';

    // Clave publica de Supabase; nunca colocar claves secretas aqui.
    const SUPABASE_URL = 'https://cdpuaxampsgxgwongbzp.supabase.co';
    const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_7b3VggTO4Rg3zPSplD1stQ_HfWYKWyb';

    const form = document.querySelector('#login');
    const app = document.querySelector('#app');
    const message = document.querySelector('#message');
    const loginButton = document.querySelector('#loginButton');

    if (!SUPABASE_URL || !SUPABASE_PUBLISHABLE_KEY) {
      message.textContent =
        'Pendiente de configurar la conexión con Supabase.';
    } else {
      const supabase = createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
      );

      async function refresh() {
        const { data: { user }, error } =
          await supabase.auth.getUser();

        let authorized = false;

        if (!error && user) {
          const result = await supabase
            .from('brik_profiles')
            .select('role')
            .eq('user_id', user.id)
            .eq('role', 'admin')
            .maybeSingle();

          authorized = !result.error && !!result.data;
        }

        form.style.display = authorized ? 'none' : 'block';
        app.style.display = authorized ? 'block' : 'none';

        if (user && !authorized) {
          message.textContent =
            'Tu cuenta no tiene acceso de administración.';
        }
      }

      form.addEventListener('submit', async event => {
        event.preventDefault();
        loginButton.disabled = true;
        message.textContent = 'Verificando acceso...';

        const { error } =
          await supabase.auth.signInWithPassword({
            email: document.querySelector('#email').value,
            password: document.querySelector('#password').value
          });

        if (error) {
          message.textContent =
            'No fue posible iniciar sesión. Revisa tus datos.';
        } else {
          message.textContent = '';
          await refresh();
        }

        loginButton.disabled = false;
      });

      document.querySelector('#logoutButton')
        .addEventListener('click', async () => {
          await supabase.auth.signOut();
          app.style.display = 'none';
          form.style.display = 'block';
          message.textContent = 'Sesión cerrada.';
        });

      refresh();
    }
  </script>
</body>
</html>
